```html
{% extends 'base.html' %}

{% block title %}
Кирүү — Kyrgyz Coder
{% endblock %}


{% block content %}

<section
    class="section"
    style="
        min-height: 80vh;
        display: flex;
        align-items: center;
        background: #fafafa;
    "
>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7">

                <div class="form-box">


                    <!-- HEADER -->

                    <div class="text-center mb-4">

                        <div
                            style="
                                width: 65px;
                                height: 65px;
                                background: #ffe5e5;
                                color: #E50914;
                                border-radius: 50%;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                margin: 0 auto 20px;
                                font-size: 28px;
                            "
                        >

                            <i class="bi bi-person"></i>

                        </div>


                        <h2 class="fw-bold mb-2">
                            Кош келиңиз!
                        </h2>


                        <p class="text-secondary mb-0">
                            Kyrgyz Coder аккаунтуңузга кириңиз
                        </p>

                    </div>


                    <!-- FORM -->

                    <form
                        method="POST"
                        action="{% url 'login' %}"
                    >

                        {% csrf_token %}


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label fw-semibold"
                            >
                                Email
                            </label>


                            <div class="input-group">

                                <span class="input-group-text bg-white">

                                    <i class="bi bi-envelope"></i>

                                </span>


                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="example@gmail.com"
                                    autocomplete="email"
                                    required
                                >

                            </div>

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-4">

                            <label
                                for="password"
                                class="form-label fw-semibold"
                            >
                                Пароль
                            </label>


                            <div class="input-group">

                                <span class="input-group-text bg-white">

                                    <i class="bi bi-lock"></i>

                                </span>


                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="••••••••"
                                    autocomplete="current-password"
                                    required
                                >


                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="toggleLoginPassword()"
                                >

                                    <i
                                        id="loginPasswordIcon"
                                        class="bi bi-eye"
                                    ></i>

                                </button>

                            </div>

                        </div>


                        <!-- LOGIN BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-red w-100 py-3"
                        >

                            <i class="bi bi-box-arrow-in-right me-2"></i>

                            Кирүү

                        </button>

                    </form>


                    <!-- REGISTER -->

                    <div class="text-center mt-4">

                        <p class="text-secondary mb-0">

                            Аккаунтуңуз жокпу?

                            <a
                                href="{% url 'register' %}"
                                style="
                                    color:#E50914;
                                    font-weight:700;
                                "
                            >
                                Катталуу
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<script>

function toggleLoginPassword() {

    const password = document.getElementById("password");

    const icon = document.getElementById("loginPasswordIcon");


    if (password.type === "password") {

        password.type = "text";

        icon.classList.remove("bi-eye");

        icon.classList.add("bi-eye-slash");

    } else {

        password.type = "password";

        icon.classList.remove("bi-eye-slash");

        icon.classList.add("bi-eye");

    }

}

</script>

{% endblock %}
```
